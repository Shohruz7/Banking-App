## Overlay for CI and for running the real stack on a laptop.
##
##     docker compose -f deploy/compose.yml -f deploy/compose.ci.yml --env-file deploy/.env.ci up -d
##
## The point of an overlay rather than a second full compose file is that CI exercises the *same*
## topology production runs — the service graph, the one-shot migrate, the healthcheck conditions
## and the nginx config are all inherited. Only the things that cannot exist without a domain and a
## certificate are changed here.

## `env_file` resolves relative to the compose file and is a different mechanism from `--env-file`,
## which only supplies variables for `${...}` interpolation. Both are needed, and the overlay has to
## restate `env_file` per service because the base file sets it through a YAML anchor — anchors are
## resolved when the base file is parsed, so there is nothing left to override centrally.
x-ci-env: &ci-env
  # `!override` and not a plain value: compose *merges* env_file lists across files, so without
  # it the base file's `.env` stays in the list and a missing `.env` is a hard failure.
  env_file: !override [.env.ci]

services:
  migrate:
    <<: *ci-env
  app:
    <<: *ci-env
  worker:
    <<: *ci-env

  web:
    # 8080, so the job needs no privileged port.
    ports: !override
      - "8080:80"
    volumes: !override
      # /etc/letsencrypt does not exist on a runner, and a missing bind mount is a hard start
      # failure rather than an empty directory.
      - certbot-webroot:/var/www/certbot

  postgres:
    # A CI database is thrown away with the job, so durability buys nothing and fsync costs real
    # wall-clock time on every migration and every seeded entry.
    command: ["postgres", "-c", "fsync=off", "-c", "full_page_writes=off", "-c", "synchronous_commit=off"]

  # Beat has nothing to contribute to a smoke test: every scheduled task it would fire is also
  # callable directly, and having it tick prices underneath the assertions makes them flaky.
  beat:
    profiles: ["donotstart"]
