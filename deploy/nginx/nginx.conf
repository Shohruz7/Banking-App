## The main nginx file. Server blocks live in app.conf.template, rendered by the image entrypoint.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # A request id per request, echoed to the client as `X-Request-ID` and logged here. The Django
    # side already stamps one on every log record (`common/logging.py`) and returns it in the body
    # of a 500, so a user reporting "it said request 3f2a…" can be traced across both logs. nginx
    # generates it when the client did not supply one.
    map $http_x_request_id $request_id_final {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format main '$remote_addr $host "$request" $status $body_bytes_sent '
                    'rt=$request_time ua="$http_user_agent" xff="$http_x_forwarded_for" '
                    'request_id=$request_id_final';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    # The server's identity is not a secret worth keeping, but the exact patch version is free
    # reconnaissance and costs nothing to withhold.
    server_tokens off;

    # Matches DATA_UPLOAD_MAX_MEMORY_SIZE in config/settings/prod.py. Two limits that disagree mean
    # a request nginx accepts and Django then rejects with a different status than the one the
    # client would have got had nginx refused it.
    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        text/css
        text/plain;
    # Not gzip_types image/png or the like: they are already compressed, and re-compressing costs
    # CPU to make the payload marginally larger.

    upstream app {
        # One pool for HTTP and WebSocket (ADR-0034). Split them by adding a second upstream and
        # pointing `location /ws/` at it — deliberately already its own location block, so that
        # change is one line the day a blocking view starts delaying socket frames.
        server app:8000;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
