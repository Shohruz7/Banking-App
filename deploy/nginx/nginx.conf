## The main nginx file. Server blocks live in app.conf.template, rendered by the image entrypoint.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # A request id per request, echoed to the client as `X-Request-ID` and logged here. The Django
    # side already stamps one on every log record (`common/logging.py`) and returns it in the body
    # of a 500, so a user reporting "it said request 3f2a…" can be traced across both logs. nginx
    # generates it when the client did not supply one.
    map $http_x_request_id $request_id_final {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format main '$remote_addr $host "$request" $status $body_bytes_sent '
                    'rt=$request_time ua="$http_user_agent" xff="$http_x_forwarded_for" '
                    'request_id=$request_id_final';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    # The server's identity is not a secret worth keeping, but the exact patch version is free
    # reconnaissance and costs nothing to withhold.
    server_tokens off;

    # Matches DATA_UPLOAD_MAX_MEMORY_SIZE in config/settings/prod.py. Two limits that disagree mean
    # a request nginx accepts and Django then rejects with a different status than the one the
    # client would have got had nginx refused it.
    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        text/css
        text/plain;
    # Not gzip_types image/png or the like: they are already compressed, and re-compressing costs
    # CPU to make the payload marginally larger.

    upstream app {
        # One pool for HTTP and WebSocket (ADR-0034). Split them by adding a second upstream and
        # pointing `location /ws/` at it — deliberately already its own location block, so that
        # change is one line the day a blocking view starts delaying socket frames.
        #
        # **Literal addresses, not service names, and this is load-bearing (ADR-0043).** An
        # `upstream` server name is resolved once, when the config is parsed; there is no `resolve`
        # parameter outside NGINX Plus. Docker deletes a stopped container's DNS record, so with
        # hostnames here `nginx -s reload` fails with "host not found in upstream" during exactly
        # the window a rolling deploy creates — and because `ngx_init_cycle` runs before the signal
        # is sent, a failed reload never sends SIGHUP at all and nginx keeps serving the *old*
        # addresses without saying so. Worse, a `web` container restarting while a peer is down
        # would refuse to start, taking the SPA, /healthz and the 503 envelope with it.
        #
        # Fixed addresses remove resolution from the path entirely: no reload is needed during a
        # deploy, a recreated replica provably returns to the same address, and an address can never
        # be handed to the other replica. **These must match `ipv4_address` in deploy/compose.yml**
        # — a two-place invariant, so CI greps both and asserts they agree.
        server 10.99.0.11:8000 max_fails=1 fail_timeout=10s;   # app_blue
        server 10.99.0.12:8000 max_fails=1 fail_timeout=10s;   # app_green
        keepalive 32;
        # Longer than gunicorn's keep-alive, so *nginx* is always the side that closes an idle
        # upstream connection. With the defaults it is the other way round, which leaves a pooled
        # connection nginx may write a request onto just as the backend's FIN arrives — and a
        # request that has already been sent is not replayed to the other peer if it is a POST.
        keepalive_timeout 60s;
        keepalive_requests 1000;
    }

    include /etc/nginx/conf.d/*.conf;
}
