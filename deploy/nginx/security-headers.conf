## Security response headers, in an include rather than written once at server level.
##
## **This file exists because of an nginx inheritance rule that silently removes headers.**
## `add_header` directives are inherited by a nested block only if that block declares *no*
## `add_header` of its own — one added anywhere in a location drops every inherited one. So
## `location = /index.html`, which sets `Cache-Control: no-store`, was serving the app's own HTML
## with no CSP at all, while `curl -I` on any other path showed the header present. The document
## that loads every script was the one page missing the policy.
##
## Including the full set everywhere that adds a header of its own is the version that cannot rot.
##
## HSTS is deliberately absent: Django owns it (`SECURE_HSTS_SECONDS` in prod.py), and two owners of
## one header is how they come to disagree.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

## CSP, which this app is unusually well placed to accept: the built index.html contains no inline
## script at all — Vite puts its module-preload polyfill inside the entry chunk — and Tailwind v4
## compiles to a static stylesheet. So `script-src 'self'` needs no nonce and no hash.
##
## Two directives are load-bearing rather than defensive:
##   img-src data:     the MFA enrolment endpoint returns its QR as a data: URI rendered into an
##                     <img>. Without this, enrolling in two-factor auth silently fails.
##   connect-src ws:   the socket. CSP3 says `'self'` covers ws/wss on the same origin, but not
##                     every shipped browser agrees, and a socket that silently fails to connect
##                     looks exactly like a backend that is down.
##
## style-src keeps 'unsafe-inline' because Recharts sets inline styles on the SVG nodes it draws.
##
## `$host` rather than the `${DOMAIN}` build variable: nginx interpolates its own variables inside
## an `add_header` value, and this file is a plain include rather than an envsubst template, so
## `${DOMAIN}` would have been emitted literally. `$host` is also the better answer — it is whatever
## host actually served the page, so the policy stays correct behind a second name or an IP.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws://$host wss://$host; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
