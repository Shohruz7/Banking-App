# The request headers every proxied location must send upstream.
#
# **An include, not inline directives, for the same nginx rule that security-headers.conf exists to
# work around — this is the request-header half of it.** `proxy_set_header` is inherited from the
# enclosing block only when the current block declares *none* of its own. Every proxied location
# here sets one: `/api/`, `/static/` and `/admin/` set `Connection ""` to hold the upstream
# keepalive, and `/ws/` sets `Upgrade`/`Connection "upgrade"`. So each of them silently dropped the
# whole server-level set, and had been doing so since the config was written.
#
# What that cost, in the order it would have been discovered:
#
#   Host          fell back to `$proxy_host`, the *upstream group name* — so Django received
#                 `Host: app` and answered DisallowedHost unless ALLOWED_HOSTS happened to contain
#                 the name of an nginx upstream. deploy/.env.example does not.
#   X-Forwarded-Proto  never arrived, so with SECURE_SSL_REDIRECT=True (prod.py) Django sees plain
#                 HTTP, redirects to https, and the redirect arrives back here — the infinite loop
#                 the comment beside that directive warns about.
#   X-Forwarded-For / X-Real-IP  never arrived, so DRF's NUM_PROXIES=1 (ADR-0038) had no forwarded
#                 chain to read and every client throttled against one shared bucket.
#   X-Request-ID  never arrived, so correlated logging (ADR-0028) logged `request_id=-` for every
#                 proxied request.
#
# Include this in the server block *and* in every location that proxies. Repeating it is not
# redundancy; it is the only thing that makes it apply.

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# What SECURE_PROXY_SSL_HEADER reads. Without it Django believes every request arrived over plain
# HTTP and SECURE_SSL_REDIRECT answers with a redirect to https — which arrives here again, and
# redirects again. An infinite loop that only appears once TLS terminates upstream.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id_final;
