## Who may reach /admin/.
##
## Included by the /admin/ location in app.conf.template. Kept in its own file so widening it for a
## demo is one edit and one `nginx -s reload`, with no risk of a fat-fingered proxy directive taking
## the site down alongside it.
##
## Why this exists at all: Django's admin authenticates with a session and a password. The TOTP
## enforced on /api/v1/auth/ does not apply to it — that is the API's login flow, not this one — so
## a superuser password is the whole control on a form that can read every account in the ledger.
## The audit log records what the admin does, but recording a break-in is not preventing one.
##
## The default is closed. Add your own address and reload:
##     docker compose exec web nginx -s reload
##
## `allow` lines are evaluated in order and the first match wins, so the deny must stay last.

# The compose network, so a container-side healthcheck or a shell session still works.
allow 127.0.0.1;
allow 172.16.0.0/12;

# Add operator addresses here. Example — replace, do not uncomment as-is:
# allow 203.0.113.42;

deny all;
