## The whole application, containerised.
##
## The root `docker-compose.yml` is a different thing and stays: it runs Postgres and Redis only,
## for a host `runserver` with autoreload and an attachable debugger. That is the dev loop and it is
## faster than anything here. This file is what production runs, and what CI smoke-tests so that
## claim is checked rather than asserted.
##
##     docker compose -f deploy/compose.yml --env-file deploy/.env up -d
##
## Images are referenced by tag, never `latest` (ADR-0033): a rollback is then
## `IMAGE_TAG=<previous-sha> ./deploy/deploy.sh`, which is a different operation from a rebuild.

name: banking

x-backend: &backend
  image: ${BACKEND_IMAGE:-banking-backend}:${IMAGE_TAG:-local}
  env_file: [.env]
  # Every backend service runs the same image and the same code, so they must also see the same
  # environment — an anchor rather than four copies that can drift.
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    migrate: {condition: service_completed_successfully}
  volumes:
    - media:/app/media
  restart: unless-stopped

# The two rolled replicas (ADR-0043). Everything here is what makes replacing one at a time safe.
x-app: &app
  <<: *backend
  expose: ["8000"]
  # Strictly greater than gunicorn's `--graceful-timeout 30`, never equal to it. Docker sends
  # SIGTERM, waits this long, then SIGKILLs. At 30 == 30 the kill lands on the same tick gunicorn
  # starts terminating its own workers, so the graceful window is not 30 seconds, it is a race.
  stop_grace_period: 35s

# An explicit subnet so the two app replicas can hold fixed addresses — see the `upstream` block in
# deploy/nginx/nginx.conf, which names them literally. 10.99.0.0/24 rather than letting Docker
# allocate from 172.16/12, so an unrelated `docker network create` on this box cannot collide, and
# not 172.31 either, which is the default VPC range.
networks:
  default:
    ipam:
      config:
        - subnet: 10.99.0.0/24

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-banking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-banking}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Deliberately no published port. The database is reachable on the compose network and nowhere
    # else; exposing 5432 on a public box is how a demo becomes an incident.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-banking} -d ${POSTGRES_DB:-banking}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # `noeviction` is not a default worth accepting here. This one Redis is three things at once
    # (base.py): the DRF throttle cache on db 0, the Celery broker on db 1, and the Channels layer
    # on db 2. Under `allkeys-lru` a memory spike would silently evict *queued tasks* — a statement
    # that never generates, a limit order that never matches, and no error anywhere. Refusing
    # writes is a loud failure, which is the right one. Throttle keys carry TTLs, so the cache half
    # still expires normally.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Runs to completion, once per `up`, before anything that touches the database starts.
  #
  # The alternative — migrating from each container's entrypoint — runs N times concurrently for N
  # workers and relies on Postgres' migration lock to serialise them. That mostly works, which is
  # worse than either outcome: a failed migration would be retried independently by every container
  # instead of stopping the release.
  migrate:
    image: ${BACKEND_IMAGE:-banking-backend}:${IMAGE_TAG:-local}
    env_file: [.env]
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: "no"

  # Two replicas of the same image, replaced one at a time so a release does not drop a request
  # (ADR-0043). They are ordinary named services rather than `deploy.replicas` because nginx has to
  # name them: open-source nginx resolves an upstream host once, at config-parse time, and Docker
  # deletes a stopped container's DNS record — so a hostname there breaks during exactly the window
  # a rolling deploy creates. The addresses below are pinned for the same reason and **must match
  # `upstream app` in deploy/nginx/nginx.conf**; CI asserts that they do.
  app_blue:
    <<: *app
    networks:
      default: {ipv4_address: 10.99.0.11}

  app_green:
    <<: *app
    networks:
      default: {ipv4_address: 10.99.0.12}

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "--loglevel", "info", "--concurrency", "2"]
    healthcheck:
      # **CMD-SHELL, not CMD, and the difference is the whole check.** A worker's node name is
      # `celery@<hostname>`, so the probe has to interpolate one. In exec form (`CMD`) there is no
      # shell, so `$HOSTNAME` is passed through as four literal characters and the ping goes to a
      # node that cannot exist — "No nodes replied within time constraint", forever, while the
      # worker sits there perfectly healthy consuming tasks.
      #
      # Worse than a false negative on a dashboard: `docker compose up --wait` blocks on it, so the
      # whole stack is reported as failed to start. That is exactly how CI caught this.
      #
      # `$$` is compose's escape for a literal `$` — it survives interpolation and reaches the shell,
      # which is the thing that expands it.
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Generous: a cold worker has to import Django, connect to the broker and register its queues
      # before it can answer a ping, and failing during that is not the same as being unhealthy.
      start_period: 60s
    # Long enough for an in-flight task to finish rather than be redelivered. `CELERY_TASK_ACKS_LATE`
    # means a SIGKILL mid-task loses nothing — the task is redelivered — so this is about not doing
    # the work twice, not about correctness.
    stop_grace_period: 60s

  beat:
    <<: *backend
    # **Exactly one replica, always.** Beat is a scheduler, not a worker: two of them means every
    # periodic task fires twice — two price ticks a minute, two statement runs on the 1st, two
    # reconciliation passes. `deploy.replicas` is not set anywhere for the same reason, and scaling
    # this service is the one thing that must never be done casually.
    command:
      - celery
      - -A
      - config
      - beat
      - --loglevel
      - info
      - --schedule
      - /var/run/celery/schedule
    volumes:
      - media:/app/media
      # Beat's own schedule state. On a named volume so a restart does not re-fire everything it
      # believes it missed while down.
      - beatstate:/var/run/celery

  web:
    image: ${WEB_IMAGE:-banking-web}:${IMAGE_TAG:-local}
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      # `service_started`, not `service_healthy`: waiting on the health start_period would leave the
      # SPA and /healthz unreachable for ~30s on a cold boot, which is a worse trade than nginx
      # briefly having no live peer — it answers that with the ADR-0006 envelope.
      app_blue: {condition: service_started}
      app_green: {condition: service_started}
    volumes:
      # Read-only: nginx needs to read certificates, never to write them. Certbot runs on the host
      # (ADR-0040), so renewal keeps working even when this stack is down.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  beatstate:
  certbot-webroot:
  # Statement PDFs. A named volume rather than S3 (ADR-0039) — durable across deploys on a
  # single-host box, and included in the nightly off-box backup, which is where the durability was
  # actually wanted.
  media:
