<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Banking Platform">
  <title>Banking Platform</title>
  <!--
    A ledger, not a bank building: two columns of entries either side of a rule, which is what a
    double-entry journal actually looks like and what this project is about. Drawn in the brand
    hue at a lightness that holds up on both a light and a dark browser tab, so one file serves
    both themes — an SVG favicon cannot carry a prefers-color-scheme swap reliably across browsers,
    and a mid-tone mark is the honest way to avoid needing one.
  -->
  <rect width="32" height="32" rx="7" fill="#2563c9" />
  <g fill="#ffffff">
    <rect x="15" y="7" width="2" height="18" rx="1" opacity="0.55" />
    <rect x="7" y="10" width="6" height="2.4" rx="1.2" />
    <rect x="7" y="15" width="6" height="2.4" rx="1.2" />
    <rect x="7" y="20" width="6" height="2.4" rx="1.2" />
    <rect x="19" y="10" width="6" height="2.4" rx="1.2" />
    <rect x="19" y="15" width="6" height="2.4" rx="1.2" />
    <rect x="19" y="20" width="6" height="2.4" rx="1.2" />
  </g>
</svg>
