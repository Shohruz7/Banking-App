[project]
name = "banking-backend"
version = "0.1.0"
description = "Personal banking platform backend — double-entry ledger on Django + DRF"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.16",
    "djangorestframework-simplejwt>=5.5",
    "django-environ>=0.12",
    "psycopg[binary]>=3.2",
    "uuid6>=2024.7.10",
    "pyotp>=2.9",
    "qrcode>=8.0",
    # Cache backend for DRF throttle state (ADR-0015); also the Week 5 Celery broker and the
    # Week 6 Channels layer. prod.py cannot boot without a shared cache, so it lands now.
    "redis>=5.0",
    # Scheduled price ticks and limit-order matching (ADR-0019). Beat ships in the same package.
    "celery>=5.4",
    # WebSocket transport (ADR-0022). The daphne extra makes `runserver` serve ASGI in dev, so the
    # socket and the API are reachable on one port without a second process.
    "channels[daphne]>=4.2",
    # The cross-process channel layer: a fill posted in a web worker has to reach a socket held by
    # a different process, and a price tick is published from a Celery worker entirely.
    "channels-redis>=4.2",
    # Monthly statement PDFs (ADR-0021). Pure Python, no system libraries — which is why it is
    # ReportLab and not a wkhtmltopdf/WeasyPrint pipeline that Week 8's image would have to carry.
    "reportlab>=4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.11",
    "pytest-cov>=6.0",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    # Channels' WebsocketCommunicator drives an async consumer, so the suite needs an async runner.
    "pytest-asyncio>=0.24",
    # Extracts text from a rendered statement, so one test can assert the numbers actually landed
    # on the page rather than that some bytes were produced.
    "pypdf>=5.0",
    "ruff>=0.11",
    "mypy>=1.15",
    "django-stubs[compatible-mypy]>=5.2",
    "djangorestframework-stubs>=3.16",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "DJ",  # django
    "SIM", # simplify
]

[tool.ruff.lint.per-file-ignores]
# Settings modules compose via star imports by design (ADR-0004).
"config/settings/*" = ["F401", "F403", "F405"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
mypy_path = "."
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# django-environ, qrcode, celery, channels and reportlab ship no usable type stubs
module = [
    "environ.*",
    "qrcode.*",
    "celery.*",
    "channels.*",
    "channels_redis.*",
    "reportlab.*",
    "pypdf.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
addopts = "-q"
# WebSocket tests drive an async consumer through Channels' communicator; every other test in the
# suite stays synchronous, so async tests are opted in with a marker rather than auto-detected.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["."]
omit = ["manage.py", "*/migrations/*", "config/asgi.py", "config/wsgi.py"]
