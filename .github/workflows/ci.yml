name: CI

on:
  push:
    branches: [main]
  pull_request:

# A force-push should cancel the run it superseded rather than queue behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  checks:
    name: lint · types · tests
    runs-on: ubuntu-latest
    # The concurrency tests coordinate threads through a barrier. Those barriers now carry their own
    # timeout, but this is the backstop: without it, anything that wedges runs until GitHub's
    # six-hour default kills it, burning the runner and telling you nothing.
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: banking
          POSTGRES_PASSWORD: banking
          POSTGRES_DB: banking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U banking -d banking"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://banking:banking@localhost:5432/banking

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy .

      # A model change without its migration used to merge green and fail on deploy.
      - name: Migrations are in sync
        run: uv run python manage.py makemigrations --check --dry-run

      # The one command that would have caught the missing STATIC_ROOT. Runs against prod settings
      # with throwaway secrets: what is being checked is the *configuration*, not these values.
      - name: Deployment checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-only-placeholder-key-not-used-to-sign-anything-at-all
          DJANGO_ALLOWED_HOSTS: example.com
          CACHE_URL: locmemcache://
          FIELD_ENCRYPTION_KEYS: ci:ZGV2LW9ubHktaW5zZWN1cmUta2V5LTMyLWJ5dGVzISE=
        run: uv run python manage.py check --deploy --fail-level WARNING

      # `--cov` alone printed a number and exited 0 regardless; the gate lives in pyproject.toml.
      - name: Tests (pytest)
        run: uv run pytest --cov --cov-report=term-missing

      # Advisory rather than blocking: a CVE published against a transitive dependency should not
      # stop an unrelated bugfix from merging, but it should be visible on the run that introduced
      # it rather than discovered by accident months later.
      - name: Dependency audit
        run: uv run --with pip-audit pip-audit --skip-editable
        continue-on-error: true

  frontend:
    name: frontend · lint · types · tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The workflow-level default is `backend`; this job lives in the other half of the monorepo and
    # has to say so, because `defaults` at the top level applies to every job that does not override
    # it — a step here without this block would run `npm ci` in a directory with no package.json.
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npx eslint .

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Tests (vitest)
        run: npx vitest run --coverage

      - name: Build
        run: npx vite build

  # The client's types are generated from the API's own description, so "the client compiles" is
  # only meaningful if the description is current. This regenerates both from the running code and
  # fails on any diff — which is what stops a serializer change from reaching main with a frontend
  # that still believes the old shape.
  schema-drift:
    name: frontend types match the API
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend && uv sync --locked
          cd ../frontend && npm ci

      - name: Regenerate the schema and the types
        run: |
          cd backend
          uv run python manage.py spectacular \
            --file ../frontend/openapi.json --format openapi-json --fail-on-warn
          cd ../frontend
          npx openapi-typescript ./openapi.json -o src/api/schema.d.ts

      - name: Fail if either is stale
        run: git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.d.ts
        working-directory: .
