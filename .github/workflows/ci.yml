name: CI

on:
  push:
    branches: [main]
  pull_request:

# A force-push should cancel the run it superseded rather than queue behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  checks:
    name: lint · types · tests
    runs-on: ubuntu-latest
    # The concurrency tests coordinate threads through a barrier. Those barriers now carry their own
    # timeout, but this is the backstop: without it, anything that wedges runs until GitHub's
    # six-hour default kills it, burning the runner and telling you nothing.
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: banking
          POSTGRES_PASSWORD: banking
          POSTGRES_DB: banking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U banking -d banking"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://banking:banking@localhost:5432/banking

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy .

      # A model change without its migration used to merge green and fail on deploy.
      - name: Migrations are in sync
        run: uv run python manage.py makemigrations --check --dry-run

      # The one command that would have caught the missing STATIC_ROOT. Runs against prod settings
      # with throwaway secrets: what is being checked is the *configuration*, not these values.
      - name: Deployment checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-only-placeholder-key-not-used-to-sign-anything-at-all
          DJANGO_ALLOWED_HOSTS: example.com
          CACHE_URL: locmemcache://
          FIELD_ENCRYPTION_KEYS: ci:ZGV2LW9ubHktaW5zZWN1cmUta2V5LTMyLWJ5dGVzISE=
        run: uv run python manage.py check --deploy --fail-level WARNING

      # `--cov` alone printed a number and exited 0 regardless; the gate lives in pyproject.toml.
      - name: Tests (pytest)
        run: uv run pytest --cov --cov-report=term-missing

      # Advisory rather than blocking: a CVE published against a transitive dependency should not
      # stop an unrelated bugfix from merging, but it should be visible on the run that introduced
      # it rather than discovered by accident months later.
      - name: Dependency audit
        run: uv run --with pip-audit pip-audit --skip-editable
        continue-on-error: true

  frontend:
    name: frontend · lint · types · tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The workflow-level default is `backend`; this job lives in the other half of the monorepo and
    # has to say so, because `defaults` at the top level applies to every job that does not override
    # it — a step here without this block would run `npm ci` in a directory with no package.json.
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npx eslint .

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Tests (vitest)
        run: npx vitest run --coverage

      - name: Build
        run: npx vite build

  # The client's types are generated from the API's own description, so "the client compiles" is
  # only meaningful if the description is current. This regenerates both from the running code and
  # fails on any diff — which is what stops a serializer change from reaching main with a frontend
  # that still believes the old shape.
  schema-drift:
    name: frontend types match the API
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend && uv sync --locked
          cd ../frontend && npm ci

      - name: Regenerate the schema and the types
        run: |
          cd backend
          uv run python manage.py spectacular \
            --file ../frontend/openapi.json --format openapi-json --fail-on-warn
          cd ../frontend
          npx openapi-typescript ./openapi.json -o src/api/schema.d.ts

      - name: Fail if either is stale
        run: git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.d.ts
        working-directory: .

  # ------------------------------------------------------------------------------------------------
  # The stack the deploy actually runs
  # ------------------------------------------------------------------------------------------------
  #
  # `checks` and `frontend` prove the code is correct in isolation. This proves the *arrangement* is:
  # that the images build, that migrations run exactly once, that nginx routes what the client
  # assumes it routes, and — the item Week 6 wrote down as an honest gap and could not close — that
  # the Redis channel layer carries a message between two containers.
  stack:
    name: the deployed stack, end to end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # `load: true` rather than a push: this job builds the images to test them, and a registry
      # round trip would add minutes to prove nothing extra. The deploy workflow pushes them.
      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          tags: banking-backend:ci
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          tags: banking-web:ci
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Generated, not committed: `deploy/.env.ci` is gitignored along with every other env file,
      # and a throwaway keyring that lives in the repo is the exact thing ADR-0027 refuses. Same
      # posture as the placeholder credentials the `checks` job uses for `check --deploy`.
      - name: Write a throwaway environment
        run: |
          python - <<'PY' > deploy/.env.ci
          import base64, os, secrets
          key = base64.urlsafe_b64encode(os.urandom(32)).decode()
          print(f"""IMAGE_TAG=ci
          BACKEND_IMAGE=banking-backend
          WEB_IMAGE=banking-web
          DJANGO_SETTINGS_MODULE=config.settings.prod
          DJANGO_SECRET_KEY={secrets.token_urlsafe(48)}
          DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,app
          CSRF_TRUSTED_ORIGINS=http://localhost:8080
          DOMAIN=localhost
          POSTGRES_USER=banking
          POSTGRES_PASSWORD=ci-not-a-secret
          POSTGRES_DB=banking
          DATABASE_URL=postgres://banking:ci-not-a-secret@postgres:5432/banking
          DB_SSLMODE=disable
          REDIS_URL=redis://redis:6379/0
          CACHE_URL=redis://redis:6379/0
          CELERY_BROKER_URL=redis://redis:6379/1
          CHANNEL_LAYER_URL=redis://redis:6379/2
          FIELD_ENCRYPTION_KEYS=ci:{key}
          ONBOARDING_OPENING_DEPOSIT=1000.0000
          MARKET_TICK_SECONDS=60
          LOG_LEVEL=INFO
          HTTP_PORT=8080
          SECURE_SSL_REDIRECT=False
          """.replace("          ", ""))
          PY

      # Cheap and catches a typo before eight containers try to start on it.
      - name: The compose files parse
        run: docker compose -f deploy/compose.yml -f deploy/compose.ci.yml --env-file deploy/.env.ci config -q

      - name: Start the stack
        run: docker compose -f deploy/compose.yml -f deploy/compose.ci.yml --env-file deploy/.env.ci up -d --wait --wait-timeout 180

      # `--wait` already blocks on the healthchecks, so reaching here means Postgres and the cache
      # are up and `migrate` exited 0. This asserts the path *through nginx*, which is different:
      # it is the first thing that proves the proxy is pointed at the app at all.
      - name: Readiness answers through nginx
        run: |
          body=$(curl -fsS http://localhost:8080/api/v1/ready/)
          echo "$body"
          echo "$body" | grep -q '"status": *"ready"'

      - name: nginx answers its own liveness probe
        run: curl -fsS http://localhost:8080/healthz | grep -q '"status":"ok"'

      # The single most common way a React Router deploy is broken. Without `try_files`, this is a
      # 404 from nginx and the app looks fine until somebody refreshes.
      - name: A deep link returns the SPA rather than a 404
        run: |
          curl -fsS http://localhost:8080/portfolio | grep -qi '<div id="root">'

      # whitenoise plus ManifestStaticFilesStorage. A hashed URL that 404s means `collectstatic`
      # ran against different code than the manifest the app is reading.
      - name: The admin has its CSS, at a manifest-hashed URL
        run: |
          html=$(curl -fsS -H 'X-Forwarded-For: 127.0.0.1' http://localhost:8080/admin/login/)
          css=$(echo "$html" | grep -o '/static/admin/css/base\.[a-f0-9]\{8,\}\.css' | head -1)
          test -n "$css" || { echo "no hashed admin CSS in the login page"; exit 1; }
          curl -fsS -o /dev/null "http://localhost:8080$css"
          echo "served $css"

      - name: Seed a market and a dataset
        run: |
          C="docker compose -f deploy/compose.yml -f deploy/compose.ci.yml --env-file deploy/.env.ci exec -T app"
          $C python manage.py seed_instruments --ticks 30 --seed 1
          $C python manage.py seed_demo --users 6 --days 60 --seed 1

      # The dataset went in through `transfer` and `place_order`, so this is a real check of both
      # Postgres invariants against thousands of rows the application itself produced (ADR-0037).
      - name: The seeded ledger holds its invariants
        run: |
          docker compose -f deploy/compose.yml -f deploy/compose.ci.yml --env-file deploy/.env.ci \
            exec -T app python manage.py check_ledger_invariants

      - name: A seeded customer can authenticate through nginx
        run: |
          curl -fsS -X POST http://localhost:8080/api/v1/auth/token/ \
            -H 'Content-Type: application/json' \
            -d '{"username":"demo","password":"demo-password-1234"}' | grep -q '"access"'

      # ------------------------------------------------------------------------------------------
      # The cross-process channel-layer proof
      # ------------------------------------------------------------------------------------------
      #
      # Week 6 recorded this as an honest gap: the suite's channel layer is in-process, so nothing
      # proved that a message published in a Celery worker reaches a socket held by a *different*
      # process. Here the two are genuinely separate containers on a real Redis, which is the
      # production topology rather than a simulation of it.
      - name: A tick published in the worker reaches a socket in the app
        run: |
          pip install --quiet 'websockets>=13'
          symbol=$(docker compose -f deploy/compose.yml -f deploy/compose.ci.yml --env-file deploy/.env.ci \
            exec -T app python manage.py shell --no-imports -c "from markets.models import Instrument; print(Instrument.objects.filter(is_active=True).first().symbol)" | tr -d '\r')
          echo "watching $symbol"

          python deploy/smoke_socket.py \
            --base http://localhost:8080 \
            --username demo --password demo-password-1234 \
            --symbol "$symbol" --timeout 60 &
          watcher=$!

          # Give the socket time to authenticate and subscribe before the tick is published; a tick
          # that fires first is not delivered to a group nobody has joined yet, and the failure
          # would look like a broken channel layer rather than a race in this script.
          sleep 12
          docker compose -f deploy/compose.yml -f deploy/compose.ci.yml --env-file deploy/.env.ci \
            exec -T worker celery -A config call markets.advance_prices

          wait $watcher

      # A dead backend must still speak the ADR-0006 envelope: the client parses `response.json()`
      # unconditionally, so nginx's HTML error page would arrive as a parse failure rather than as
      # an outage the UI can describe.
      - name: An outage is still JSON
        run: |
          docker compose -f deploy/compose.yml -f deploy/compose.ci.yml --env-file deploy/.env.ci stop app
          sleep 3
          code=$(curl -s -o /tmp/body -w '%{http_code}' http://localhost:8080/api/v1/accounts/)
          cat /tmp/body; echo
          test "$code" = "503"
          grep -q '"code":"service_unavailable"' /tmp/body

      - name: Container logs
        if: failure()
        run: docker compose -f deploy/compose.yml -f deploy/compose.ci.yml --env-file deploy/.env.ci logs --tail 120

      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose.yml -f deploy/compose.ci.yml --env-file deploy/.env.ci down -v

  # Advisory, like the dependency audit in `checks`: a new CVE in a base image should be visible on
  # the next run without blocking a merge that has nothing to do with it.
  image-scan:
    name: image lint · vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Lint the Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile

      - name: Lint the web Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
